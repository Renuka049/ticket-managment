<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Masters - CRM System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="masters-page">
    <main class="main-content">
        <div class="container-fluid">
            <div class="row">
                <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                    <div class="brand-box">
                        <div class="logo-square">R</div>
                        <div class="brand-text">RevalERP</div>
                    </div>
                    <div class="position-sticky pt-3">
                       <ul class="nav flex-column">
                            <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>
                                    Dashboard</a></li>
                            <li class="nav-item"><a class="nav-link" href="add-ticket.html"><i
                                        class="fas fa-plus-circle me-1"></i>Add</a></li>
                            <li class="nav-item"><a class="nav-link" href="tickets.html"><i
                                        class="fas fa-ticket-alt me-1"></i>Tickets</a></li>
                            <li class="nav-item"><a class="nav-link" href="reports.html"><i
                                        class="fas fa-th-large me-1"></i> Reports</a></li>
                            <li class="nav-item"><a class="nav-link " href="masters.html"><i class="fas fa-chart-bar me-1"></i>
                                    Masters</a></li>
                        </ul>
                    </div>
                </nav>

                <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                    <div class="app-frame">
                        <div class="app-header mb-3">
                            <button class="btn btn-sm app-hamburger"><i class="fas fa-bars"></i></button>
                            <div class="app-title">Masters</div>
                            <div class="app-actions">
                                <button id="extractBtn" class="btn btn-sm btn-extract">Extract</button>
                                <button id="loginBtn" class="btn btn-sm btn-login">Login</button>
                                <button id="notifyBtn" class="btn btn-sm btn-notify" title="Notifications"><i
                                        class="fas fa-bell"></i></button>
                                <button id="userBtn" class="btn btn-sm btn-user" title="Account"><i
                                        class="fas fa-user"></i></button>
                            </div>
                        </div>

                        <div class="app-breadcrumb">Masters</div>

                        <div class="card shadow mb-4">
                            <div class="card-header py-3 d-flex justify-content-between align-items-center">
                                <h6 class="m-0 font-weight-bold text-primary">Master Data</h6>
                                <button class="btn btn-sm btn-primary"
                                    onclick="window.location.href='masters-edit.html'">New Master</button>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered" id="mastersTable">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Description</th>
                                                <th>Records</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>Departments</td>
                                                <td>Department master data used across tickets</td>
                                                <td>12</td>
                                                <td><button class="btn btn-sm btn-outline-primary">Manage</button></td>
                                            </tr>
                                            <tr>
                                                <td>Users</td>
                                                <td>Application users and roles</td>
                                                <td>34</td>
                                                <td><button class="btn btn-sm btn-outline-primary">Manage</button></td>
                                            </tr>
                                            <tr>
                                                <td>Priorities</td>
                                                <td>Priority values for tickets</td>
                                                <td>4</td>
                                                <td><button class="btn btn-sm btn-outline-primary">Manage</button></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
